.modalmask {
  position: fixed;
  font-family: Arial, sans-serif;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: #000000;
  z-index: 99999;
  opacity: 0;
  transition: opacity 0ms ease-in;
  pointer-events: none;
  overflow-y: auto;
}

.modalmask:target {
  opacity: 1;
  pointer-events: auto;
}

.modalbox {
  width: 100%;
  position: relative;
  padding: 0px 0px 0px 0px;
  background: #000000;
  border-radius: 3px;
  transition: all 0ms ease-in;
  overflow-y: auto;
}

.movedown {
  background-color: #000000;
  padding: 15px 25px 10px 25px;
  margin: 0 auto;
}

.rotate {
  margin: 0 auto;
  transform: scale(-5, -5);
}

.resize {
  margin: 0 auto;
  width: 0;
  height: 0;
}

.modalmask:target .movedown {		
  margin: 0 auto;
}
.modalmask:target .rotate {		
  transform: rotate(360deg) scale(1, 1);
}

.modalmask:target .resize {
  width: 300px;
  height: 200px;
}

.nsc {
  position: absolute;
  bottom: 1%;
  right: 0;
}

p {
  font-size: 0;
